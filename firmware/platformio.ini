; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; 序列埠
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, log2file

; Flash 分割
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

; 函式庫（第一次編譯成功後再鎖定版本）
lib_deps =
    milesburton/DallasTemperature
    adafruit/DHT sensor library
    robtillaart/INA226
    adafruit/Adafruit SH110X        ; 取代 Adafruit SSD1306
    bblanchon/ArduinoJson

; ---- 測試程式：只編譯 test_sketches 裡指定的那一個檔案 ----
; extends 會沿用 esp32dev 的所有設定（板子、函式庫、序列埠速度…）
; -<*> 先排除 src/ 裡的全部檔案（包含 main.cpp），再只加入要測的那一個
[env:sensor_check]
extends = env:esp32dev
build_src_filter = -<*> +<../test_sketches/sensor_check.cpp>

[env:oled_test]
extends = env:esp32dev
build_src_filter = -<*> +<../test_sketches/oled_test.cpp>

[env:onewire_test]
extends = env:esp32dev
build_src_filter = -<*> +<../test_sketches/onewire_test.cpp>